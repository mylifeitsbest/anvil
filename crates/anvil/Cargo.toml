[package]
name = "anvil"
description = "Anvil — быстрая и лёгкая IDE на Rust"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "anvil"
path = "src/main.rs"

[features]
default = []
# Рендер через wgpu (DX12/Vulkan/Metal) вместо OpenGL
wgpu = ["eframe/wgpu"]

[dependencies]
anvil-core.workspace = true
anvil-config.workspace = true
anvil-syntax.workspace = true
anvil-toolchains.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "wayland", "x11"] }
notify.workspace = true
toml_edit.workspace = true
ignore.workspace = true
rfd.workspace = true
toml.workspace = true
serde.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
