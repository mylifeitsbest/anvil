# Встроенные языковые серверы (LSP) Anvil.
#
# Как и паки тулчейнов, это просто данные: свой сервер добавляется TOML-файлом
# с секцией [[server]] в папке packs/ настроек. Сервер запускается, только
# когда открыт файл его языка.
#
#   command  — исполняемые файлы по порядку предпочтения (берётся первый найденный)
#   args     — аргументы запуска
#   probe    — аргументы проверки «установлен ли на самом деле» (пусто — без проверки)
#   roots    — файлы-признаки корня проекта
#   priority — чем больше, тем раньше выбирается сервер для языка

[[server]]
id = "rust-analyzer"
name = "rust-analyzer"
languages = ["rust"]
command = ["rust-analyzer"]
probe = ["--version"]
roots = ["Cargo.toml"]
homepage = "https://rust-analyzer.github.io"
install = { windows = "rustup component add rust-analyzer", macos = "rustup component add rust-analyzer", linux = "rustup component add rust-analyzer" }

[[server]]
id = "pyright"
name = "Pyright"
languages = ["python"]
command = ["basedpyright-langserver", "pyright-langserver"]
args = ["--stdio"]
roots = ["pyproject.toml", "setup.py", "requirements.txt"]
priority = 10
homepage = "https://github.com/microsoft/pyright"
install = { windows = "npm install -g pyright", macos = "npm install -g pyright", linux = "npm install -g pyright" }

[[server]]
id = "pylsp"
name = "Python LSP Server"
languages = ["python"]
command = ["pylsp"]
probe = ["--version"]
roots = ["pyproject.toml", "setup.py"]
priority = 5
homepage = "https://github.com/python-lsp/python-lsp-server"
install = { windows = "py -m pip install python-lsp-server", macos = "pip3 install python-lsp-server", linux = "pip3 install python-lsp-server" }

[[server]]
id = "typescript-language-server"
name = "TypeScript / JavaScript"
languages = ["typescript", "tsx", "javascript"]
command = ["typescript-language-server"]
args = ["--stdio"]
probe = ["--version"]
roots = ["tsconfig.json", "jsconfig.json", "package.json"]
homepage = "https://github.com/typescript-language-server/typescript-language-server"
install = { windows = "npm install -g typescript typescript-language-server", macos = "npm install -g typescript typescript-language-server", linux = "npm install -g typescript typescript-language-server" }

[[server]]
id = "clangd"
name = "clangd (C / C++)"
languages = ["c", "cpp"]
command = ["clangd"]
probe = ["--version"]
roots = ["compile_commands.json", "CMakeLists.txt", ".clangd"]
homepage = "https://clangd.llvm.org"
install = { windows = "winget install -e --id LLVM.LLVM", macos = "brew install llvm", linux = "sudo apt install -y clangd" }

[[server]]
id = "gopls"
name = "gopls (Go)"
languages = ["go"]
command = ["gopls"]
