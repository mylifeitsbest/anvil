# Встроенные паки тулчейнов Anvil.
#
# Пак — это описание компилятора/интерпретатора: как его найти, как запустить
# файл или проект и как установить. Свой пак = TOML-файл в папке packs/
# настроек — никакого кода, ничего не грузится в память, пока не нужно.
#
# Подстановки в командах:
#   {file} — путь к файлу   {dir} — его папка   {stem} — имя без расширения
#   {out}  — путь к собранному бинарнику (во временной папке)
#   {root} — корень проекта  {cmd} — найденная команда из detect.commands
#
# priority: чем больше, тем раньше выбирается пак для языка.

[[pack]]
id = "rust"
name = "Rust (rustc / cargo)"
languages = ["rust"]
homepage = "https://www.rust-lang.org/tools/install"
priority = 10
detect = { commands = ["rustc", "cargo"], version = ["rustc", "--version"] }
run = { build = "rustc --edition 2021 -O {file} -o {out}", run = "{out}" }
project = { marker = "Cargo.toml", build = "cargo build", run = "cargo run" }
install = { windows = "winget install -e --id Rustlang.Rustup", macos = "brew install rustup && rustup-init -y", linux = "curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y" }

[[pack]]
id = "gcc-c"
name = "GCC (C)"
languages = ["c"]
homepage = "https://winlibs.com"
priority = 10
detect = { commands = ["gcc"], version = ["gcc", "--version"] }
run = { build = "gcc {file} -O2 -Wall -o {out}", run = "{out}" }
project = { marker = "Makefile", run = "make" }
install = { windows = "winget install -e --id BrechtSanders.WinLibs.POSIX.UCRT", macos = "xcode-select --install", linux = "sudo apt install -y build-essential" }

