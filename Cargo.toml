[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/anvil"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mylifeitsbest/anvil"

[workspace.dependencies]
anvil-core = { path = "crates/anvil-core" }
anvil-config = { path = "crates/anvil-config" }
anvil-syntax = { path = "crates/anvil-syntax" }
anvil-toolchains = { path = "crates/anvil-toolchains" }
anvil-lsp = { path = "crates/anvil-lsp" }
anvil-collab = { path = "crates/anvil-collab" }
anvil-relay = { path = "crates/anvil-relay" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-types = "0.97"
toml = "1"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
regex = "1"
directories = "6"
notify = "9"
which = "8"
rfd = "0.18"
serde_ignored = "0.1"
toml_edit = "0.25"
ignore = "0.4"
# совместная работа: CRDT, TLS 1.3 (ring, без C-тулчейна aws-lc), самоподписанные сертификаты relay
yrs = "0.28"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
ring = "0.17"
postcard = { version = "1", default-features = false, features = ["use-std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
