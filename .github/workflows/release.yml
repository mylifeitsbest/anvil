name: Release

# Сборка установочных файлов при публикации релиза (или вручную).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому приложить файлы"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: anvil-windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: anvil-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: anvil-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libgtk-3-dev
      - name: Сборка
        run: cargo build --release --locked -p anvil --target ${{ matrix.target }}
      - name: Упаковка (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/anvil.exe dist/anvil.exe
          Compress-Archive -Path dist/anvil.exe, README.md, LICENSE -DestinationPath dist/${{ matrix.name }}.zip
      - name: Установщик (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'anvil').version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$ver" "/DSourceExe=..\target\${{ matrix.target }}\release\anvil.exe" installer\anvil.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\anvil-setup-x64.exe
      - name: Упаковка (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/anvil dist/anvil
          tar -czf dist/${{ matrix.name }}.tar.gz -C dist anvil -C "$GITHUB_WORKSPACE" README.md LICENSE
          rm dist/anvil
      - name: Приложить к релизу
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: dist/*
          overwrite_files: true
